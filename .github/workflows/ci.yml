name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest numpy ruff
      - name: Check release metadata
        run: python tools/check_release.py
      - name: Lint for correctness errors
        run: python -m ruff check --no-cache --select E9,F63,F7,F82 python tests tools examples
      - name: Run Python tests
        run: python -m pytest tests -v
        env:
          PYTHONPATH: python
          DRAGONGUI_DEV_FALLBACK: "1"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - name: Compile
        run: cargo check --locked --manifest-path native/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Clippy correctness baseline
        if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path native/Cargo.toml --lib -- -D clippy::correctness -A clippy::approx_constant -A dead-code
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  supply-chain:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Verify generated Rust notices
        run: |
          cargo fetch --locked --manifest-path native/Cargo.toml
          cargo about generate --frozen --fail --config about.toml --manifest-path native/Cargo.toml about.hbs --output-file /tmp/THIRD_PARTY_RUST_NOTICES.md
          cmp THIRD_PARTY_RUST_NOTICES.md /tmp/THIRD_PARTY_RUST_NOTICES.md
