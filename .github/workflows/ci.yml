name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Pure Python smoke tests — no native build required.
  # Runs from the source tree with dev fallback active so no window opens.
  # -------------------------------------------------------------------------
  python-tests:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest numpy

      - name: pytest
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: python
          DRAGONGUI_DEV_FALLBACK: "1"

  # -------------------------------------------------------------------------
  # Rust compile check on all three platforms.
  # Catches platform-specific winit/wgpu issues early without a full build.
  # -------------------------------------------------------------------------
  rust-check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: cargo check
        run: cargo check --manifest-path native/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # -------------------------------------------------------------------------
  # Raspberry Pi profile checks that do not require Pi hardware.
  # This validates the profile gates, conservative caps, and native compile
  # path. It is not a replacement for V3D/Mesa hardware validation.
  # -------------------------------------------------------------------------
  pi-profile-check:
    name: Raspberry Pi profile check
    runs-on: ubuntu-latest
    needs: [python-tests, rust-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: pi-profile

      - name: cargo check with Pi feature
        run: cargo check --manifest-path native/Cargo.toml --features pi
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Install test dependencies
        run: pip install pytest numpy

      - name: Python Pi profile tests
        run: >
          python -m pytest tests/test_python_api.py -q
          -k "pi_profile or backend_info or dev_fallback or line_plot or dataframe_table or scatter_lod"
        env:
          PYTHONPATH: python
          DRAGONGUI_DEV_FALLBACK: "1"
          DRAGONGUI_PROFILE: "pi"

  # -------------------------------------------------------------------------
  # Native aarch64 wheel build for the Pi profile.
  # This is intentionally manual while the port is still pre-hardware-validation:
  # it proves packaging on an arm64 hosted runner, but it still does not prove
  # Raspberry Pi V3D/Mesa rendering behavior.
  # -------------------------------------------------------------------------
  pi-arm64-wheel:
    name: Raspberry Pi arm64 wheel
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    needs: [pi-profile-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: pi-arm64-wheel

      - name: Build aarch64 Pi wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --release
            --manifest-path native/Cargo.toml
            --features pyo3/extension-module,pi
            --out dist
            -i python3.12
          manylinux: "2_28"
          rust-toolchain: stable

      - name: Install wheel and import smoke
        run: |
          python -m venv .venv-pi-wheel
          . .venv-pi-wheel/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import dragongui as dg; info = dg.backend_info(); print(info); assert info['native']; assert info['platform']['profile'] == 'pi'"
        env:
          DRAGONGUI_PROFILE: "pi"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragongui-pi-aarch64-wheel
          path: dist/*.whl

  # -------------------------------------------------------------------------
  # Windows: build the native extension, run an import smoke test.
  # Python pytest is run separately (above) without the native module so that
  # tests which call app.run() do not block on a live window.
  # -------------------------------------------------------------------------
  windows-native:
    name: Windows native build
    runs-on: windows-latest
    needs: [python-tests, rust-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install maturin
        run: pip install maturin

      - name: maturin develop
        run: python -m maturin develop --manifest-path native/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Import smoke test
        run: >
          python -c "
          import dragongui as dg;
          info = dg.backend_info();
          print(info);
          assert info['native'], f'Expected native=True: {info}'
          "

  # -------------------------------------------------------------------------
  # macOS: build the native extension, import smoke, then window smoke.
  #
  # The window smoke test uses DRAGONGUI_SMOKE_FRAMES=3, which causes the Rust
  # event loop to exit after rendering 3 frames rather than waiting for a
  # manual close. This exercises the winit main-thread path that is the actual
  # macOS risk called out in the M1 plan.
  #
  # GitHub Actions macos-latest runners are Apple Silicon hardware with Metal,
  # so wgpu GPU initialisation should succeed.
  # -------------------------------------------------------------------------
  macos-native:
    name: macOS native build
    runs-on: macos-latest
    needs: [python-tests, rust-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install maturin
        run: pip install maturin

      - name: maturin develop
        run: python -m maturin develop --manifest-path native/Cargo.toml
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Import smoke test
        run: >
          python -c "
          import dragongui as dg;
          info = dg.backend_info();
          print(info);
          assert info['native'], f'Expected native=True: {info}'
          "

      - name: Window smoke test (macOS main-thread path)
        run: >
          python -c "
          import dragongui as dg;
          app = dg.App();
          win = dg.Window('CI Smoke', width=400, height=300);
          result = app.run(win);
          print(result);
          assert result['status'] == 'ok', f'Expected ok: {result}';
          assert result['renderer'] == 'wgpu', f'Expected wgpu: {result}'
          "
        env:
          DRAGONGUI_SMOKE_FRAMES: "3"
