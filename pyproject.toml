[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "dragongui"
version = "0.1.0"
description = "A Python application toolkit for GPU-native data tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "DragonFrame contributors" }
]
keywords = ["gui", "gpu", "dataframe", "wgpu", "visualization", "rust"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
terminal = [
  "pywinpty>=2; platform_system == 'Windows'",
]
dataframe = [
  "pandas>=2",
  "polars>=1",
]
dev = [
  "maturin>=1.8,<2",
  "pytest>=8",
  "ruff>=0.8",
]
docs = [
  "furo>=2024.8",
  "myst-parser>=4",
  "sphinx>=8",
  "sphinx-autodoc-typehints>=3",
]

[project.urls]
Homepage = "https://github.com/dragonframe/dragongui"
Source = "https://github.com/dragonframe/dragongui"
Issues = "https://github.com/dragonframe/dragongui/issues"

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "python"
module-name = "dragongui._dragongui"
features = ["pyo3/extension-module"]
strip = true
include = [
  { path = "THIRD_PARTY_NOTICES.md", format = "sdist" },
  { path = "THIRD_PARTY_NOTICES.md", format = "wheel" },
  { path = "docs/*.md", format = "sdist" },
  { path = "docs/sphinx/**", format = "sdist" },
  { path = "examples/*.py", format = "sdist" },
  { path = "plans/*.md", format = "sdist" },
  { path = "plans/V2/*.md", format = "sdist" },
  { path = "plans/V3/*.md", format = "sdist" },
  { path = "tools/*.py", format = "sdist" },
  { path = "tests/*.py", format = "sdist" },
  { path = "benches/*.py", format = "sdist" },
  { path = "start.bat", format = "sdist" },
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "docs/sphinx/_build/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
cache_dir = ".test-cache"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
